name: Update verified jobs

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Run at both possible UTC hours, then gate on
    # America/Los_Angeles so this executes exactly Friday at 6 PM across DST.
    - cron: '0 1,2 * * 6'

permissions:
  contents: write

concurrency:
  group: verified-jobs-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Friday 6 PM Pacific window
        id: pacific
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DOW=$(TZ=America/Los_Angeles date +%u)
          HOUR=$(TZ=America/Los_Angeles date +%H)
          if [[ "$DOW" == "5" && "$HOUR" == "18" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.pacific.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Collect and validate official jobs
        if: steps.pacific.outputs.run == 'true'
        run: python scripts/collect_jobs.py
      - name: Validate output
        if: steps.pacific.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/jobs.json')
          d=json.loads(p.read_text())
          assert d['total'] > 0, 'No jobs were collected'
          assert all(j['url'].startswith('https://') for j in d['jobs'])
          print('Validated', d['total'], 'records')
          PY
      - name: Commit refreshed data
        if: steps.pacific.outputs.run == 'true'
        run: |
          git config user.name "sharecapsule-jobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh verified jobs $(TZ=America/Los_Angeles date +%F)"
          git push
